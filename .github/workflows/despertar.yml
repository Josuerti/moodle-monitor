name: Despertar y comprobar servidor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Despertar sitio y comprobar estado real
        run: |
          curl -fsS --max-time 20 https://moodlealberto.alwaysdata.net/
          curl -fsS --max-time 15 --retry 4 --retry-delay 10 --retry-all-errors https://moodlealberto.alwaysdata.net/healthz
