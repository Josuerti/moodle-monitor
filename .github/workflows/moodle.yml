name: Comprobar monitor (sin credenciales)

on:
  workflow_dispatch:
  push:
    paths:
      - monitor.js
      - test/**
      - test-support/**
      - .github/workflows/moodle.yml
  pull_request:
    paths:
      - monitor.js
      - test/**
      - test-support/**
      - .github/workflows/moodle.yml

permissions:
  contents: read

concurrency:
  group: comprobar-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validar sintaxis
        run: node --check monitor.js
      - name: Probar con datos ficticios (sin Moodle ni Telegram reales)
        run: node --test
