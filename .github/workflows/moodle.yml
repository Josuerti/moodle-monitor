name: Monitor Moodle

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (minuto 7)
  workflow_dispatch:       # botón para correrlo a mano

permissions:
  contents: write

concurrency: moodle-monitor

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Revisar Moodle
        run: node monitor.js
        env:
          MOODLE_URL: https://www217.ucsg.edu.ec
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_USER: ${{ secrets.MOODLE_USER }}
          MOODLE_PASS: ${{ secrets.MOODLE_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_HOUR: "7"

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "moodle-bot"
          git config user.email "moodle-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado" && git push)
